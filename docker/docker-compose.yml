version: '3.9'

volumes:
  nwaku1:
    name: 'nwaku1'
  broadcaster:
    name: 'broadcaster'

services:
  nwaku1:
    image: nwaku:latest
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    container_name: 'nwaku1'
    hostname: 'nwaku1'
    ports:
      - '60000:60000'
      - '9000:9000'
      - '8000:8000'
      - '8645:8645'
    restart: always
    volumes:
      - nwaku1:/data
      - ./appdata/swag/etc/letsencrypt:/ssl
      - ../scripts/nwaku:/app/scripts
    depends_on:
      - swag
    #entrypoint: tail -F anything
    entrypoint: >
      wakunode2 --config-file=/app/config.toml
      --nat="extip:${EXTIP}"
      --dns4-domain-name=${SUBDOMAIN}.${BASEDOMAIN}
      --nodekey=${NODEKEY_1}
      --websocket-support=true
      --websocket-secure-support=true
      --websocket-secure-key-path="/ssl/live/${SUBDOMAIN}.${BASEDOMAIN}/privkey.pem"
      --websocket-secure-cert-path="/ssl/live/${SUBDOMAIN}.${BASEDOMAIN}/fullchain.pem"

  broadcaster:
    image: 'broadcaster:latest'
    container_name: 'broadcaster'
    hostname: 'broadcaster'
    environment:
      WAKU_RPC_URL: 'http://nwaku1:8645'
      LEPTON_DB: '/mnt/broadcaster.db'
      LOG_LEVEL: 'debug'
      DEBUG: 'broadcaster*,waku:jsonrpc-api'
    depends_on:
      - nwaku1
    restart: always
    tty: true
    volumes:
      - broadcaster:/mnt

  swag:
    image: ghcr.io/linuxserver/swag
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=EST
      - URL=${BASEDOMAIN}
      - ONLY_SUBDOMAINS=true
      - SUBDOMAINS=${SUBDOMAIN}
      - VALIDATION=http
      - EMAIL=${EMAIL}
    volumes:
      - ./appdata/swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
